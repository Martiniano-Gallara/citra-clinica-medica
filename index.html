<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/citra-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no" />
    <title>CITRA — Centro Integral de Traumatología & Rehabilitación Arroyito</title>
    <meta name="description" content="Sistema SaaS de gestión clínica integral para CITRA - Centro Integral de Traumatología y Rehabilitación Arroyito." />
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Clean stale service workers & prevent mobile zoom -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) {
            reg.unregister();
          }
        });
      }

      // Bloqueo total de zoom en móviles (pinzas, doble toque y gestos táctiles)
      (function() {
        document.addEventListener('gesturestart', function(e) {
          e.preventDefault();
        });
        document.addEventListener('gesturechange', function(e) {
          e.preventDefault();
        });
        document.addEventListener('gestureend', function(e) {
          e.preventDefault();
        });
        document.addEventListener('touchstart', function(e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });
        var lastTouch = 0;
        document.addEventListener('touchend', function(e) {
          var now = Date.now();
          if (now - lastTouch <= 300) {
            e.preventDefault();
          }
          lastTouch = now;
        }, false);
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
