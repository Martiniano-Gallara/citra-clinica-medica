name: CITRA CI / Forensic Audit Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  audit-and-test:
    name: Verify Database Idempotency, RLS, E2E & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test Database Schema Idempotency & RLS (V2-M5)
        run: npm run test:rls

      - name: Run Forensic E2E Persistence Suite (50/50 Tests)
        run: npm run test:e2e

      - name: Verify Production Bundle Compilation
        run: npm run build
